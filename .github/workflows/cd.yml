name: CD

on:
  push:
    branches:
      - main # → production
      - develop # → staging

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/fluently

jobs:
  # ────────────────────────────────────────────
  # 1. DETERMINE ENVIRONMENT
  # ────────────────────────────────────────────
  context:
    name: 🌍 Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.ctx.outputs.environment }}
      image_tag: ${{ steps.ctx.outputs.image_tag }}
    steps:
      - id: ctx
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "image_tag=staging" >> $GITHUB_OUTPUT
          fi

  # ────────────────────────────────────────────
  # 2. BUILD & PUSH DOCKER IMAGES
  # ────────────────────────────────────────────
  docker:
    name: 🐳 Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: context
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: [api, web, admin]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ needs.context.outputs.image_tag }}
            type=raw,value=${{ github.sha }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=${{ needs.context.outputs.environment }}

  # ────────────────────────────────────────────
  # 3. DEPLOY — STAGING
  # ────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy → Staging
    runs-on: ubuntu-latest
    needs: [context, docker]
    if: needs.context.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.fluently.app

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway login --token "$RAILWAY_TOKEN"
          railway up --ci

      - name: Health check
        run: |
          sleep 15
          curl --fail --retry 5 --retry-delay 5 \
            https://staging-api.fluently.app/v1/health || exit 1

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Staging deploy failed for commit ${{ github.sha }}'
            })

  # ────────────────────────────────────────────
  # 4. DEPLOY — PRODUCTION
  # ────────────────────────────────────────────
  deploy-production:
    name: 🚀 Deploy → Production
    runs-on: ubuntu-latest
    needs: [context, docker]
    if: needs.context.outputs.environment == 'production'
    environment:
      name: production
      url: https://fluently.app

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway login --token "$RAILWAY_TOKEN"
          railway up --ci

      - name: Health check
        run: |
          sleep 20
          curl --fail --retry 5 --retry-delay 5 \
            https://api.fluently.app/v1/health || exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## 🚀 Deployed to Production

            **Commit:** ${{ github.sha }}
            **By:** @${{ github.actor }}
          generate_release_notes: true
